name: CD Backend

# Deploys are triggered by pushing a version tag (see /release), never by a
# branch push. A release branch fast-forward no longer deploys on its own.
# NOTE: a tag pushed by Actions with the default GITHUB_TOKEN does NOT trigger
# workflows — tagging is deliberately manual. Automating it needs a PAT/App.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing version tag to deploy (e.g. v0.7.4)"
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SA_EMAIL }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker
        run: gcloud auth configure-docker us-west1-docker.pkg.dev

      - name: Build and push image
        run: |
          set -euo pipefail
          VERSION="${{ github.event.inputs.tag || github.ref_name }}"
          SHA=$(echo "${{ github.sha }}" | cut -c1-8)
          IMAGE=us-west1-docker.pkg.dev/helio-493120/helio-backend/helio-backend:release-${VERSION}-${SHA}
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: helio-backend
          region: us-west1
          image: ${{ env.IMAGE }}
          # COOKIE_SECURE=true is required in prod for the cross-site httpOnly
          # session cookie (SameSite=None) — see HEL-287 / docs/deployment.md.
          # CLAUDE_MODEL pins the ClaudeConfig default away from ClaudeConfig's
          # own claude-opus-4-8 default (cost) — see CLAUDE.md's env var table.
          # HELIO_OWNER_EMAILS assigns the `owner` tier (unlimited assistant
          # access) to this allowlist at signup/login on both auth paths — see
          # HEL-703/UserTierConfig.fromEnv. Promote-only; unset/empty is a no-op.
          # --update-env-vars is additive: it sets only these vars and preserves
          # DATABASE_URL / CORS_ALLOWED_ORIGINS / etc. already on the service.
          # --update-secrets is the same additive idiom for Secret Manager refs
          # (--set-secrets would instead replace the whole secrets list on
          # every deploy, dropping any not named here).
          # --max-instances=2 keeps the privileged DB pool (5 connections/instance,
          # helio.db.privileged in application.conf) within db-g1-small's
          # connection budget — 3+ instances previously exhausted it under load.
          # CONNECTOR_MASTER_KEY / _KEY_ID wrap connector credentials at rest
          # (HEL-536). Both are required together: EnvMasterKeyProvider fails
          # CLOSED without them, so every connector credential write errors
          # rather than silently storing plaintext. NOTE this workflow — not
          # infra/deploy-backend.sh — is what actually deploys; the script is
          # for manual/local deploys and its wiring does NOT reach Cloud Run.
          flags: "--update-env-vars=COOKIE_SECURE=true,CLAUDE_MODEL=claude-haiku-4-5-20251001,HELIO_OWNER_EMAILS=mattheworr018@gmail.com,CONNECTOR_MASTER_KEY_ID=env-2026-08 --update-secrets=DB_PASSWORD=helio-db-password:latest,GOOGLE_CLIENT_SECRET=helio-google-client-secret:latest,ANTHROPIC_API_KEY=helio-anthropic-api-key:latest,CONNECTOR_MASTER_KEY=helio-connector-master-key:latest --max-instances=2"
