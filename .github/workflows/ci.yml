name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# HEL-1287 D10: a new push to a PR supersedes that PR's in-flight run (key = PR number). Every other event (main
# pushes) gets its own group (key = run_id) and never cancels: within ONE group GitHub keeps only one running and
# one pending run and cancels an older pending run even with cancel-in-progress false, so a shared per-ref group on
# main would silently drop a queued main run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  frontend:
    runs-on: ubuntu-latest
    # HEL-1287 D11: measured 5-7.7 min (runs 37382209230, 37387080368: 373-455 s); ~2.5x.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
            helio-mcp/package-lock.json
      - run: npm ci
      - run: npm --prefix frontend ci
      - run: npm --prefix helio-mcp ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run check:e2e-types
      - run: npm run check:helio-mcp-types
      # HEL-913 task 11b: check:node-root-encoding[:selftest]/[:ts]/[:ts:selftest] existed as
      # runnable npm scripts (5.8b/9.10) but were wired into NOTHING mandatory -- not
      # .husky/pre-commit, not this workflow -- so neither guard ever fired on a real commit or
      # PR. CI here, not .husky/pre-commit: CI is merge-blocking and cannot be bypassed, while
      # the husky chain can (and was, once, in this very ticket, via `git commit -n`) -- the
      # cheaper option here is also the stronger one. Wiring `.husky/**` itself would also trip
      # the gate-chain-change requirements (a design.md checklist plus per-script isolation-test
      # transcripts) for strictly weaker enforcement.
      - run: npm run check:node-root-encoding
      - run: npm run check:node-root-encoding:selftest
      - run: npm run check:node-root-encoding:ts
      - run: npm run check:node-root-encoding:ts:selftest
      - run: npm run format:check
      - run: npm run check:dependabot
      - run: npm run check:dependabot:selftest
      - run: npm run check:cloud-run-cpu
      - run: npm run check:cloud-run-cpu:selftest
      # HEL-1339: static guard -- the CI sbt diagnostics/cleanup path may only use recorded PIDs/PGIDs, never a
      # process-name lookup or kill. CI-only (JDK-free, node built-ins), like the guards above.
      - run: npm run check:ci-sbt-guard
      - run: npm run check:ci-sbt-guard:selftest
      # HEL-846: check:no-credential-leak[:selftest] existed as runnable npm scripts, wired only
      # into .husky/pre-commit -- bypassable with `git commit -n` (as happened once already, per
      # the HEL-913 precedent comment above), and `npm test` inside the hook is vacuous in the
      # linked worktrees where every delivery runs (HEL-768/HEL-880). CI here, not
      # .husky/pre-commit, for the same reason as HEL-913: CI is merge-blocking and cannot be
      # bypassed, and wiring `.husky/**` itself would trip the gate-chain-change requirements for
      # strictly weaker enforcement.
      - run: npm run check:no-credential-leak
      - run: npm run check:no-credential-leak:selftest
      # HEL-1037: check:tokens[:selftest] is wired into BOTH .husky/pre-commit and here -- CI
      # matters independently because a local-only guard is blind to whatever a contributor
      # skips with `git commit -n`.
      - run: npm run check:tokens
      - run: npm run check:tokens:selftest
      # HEL-866 evaluation-1.md CR2: `check:state-contrast:selftest` existed as a runnable
      # npm script but was wired into nothing mandatory -- neither `.husky/pre-commit` nor
      # this workflow -- the exact HEL-913/HEL-846/HEL-1037/HEL-996 failure mode this file's
      # own comments already name four times. It proves the rendered guard's measurement
      # core (`e2e/support/stateContrast.mjs`) is failable (the dark-defect/alpha-
      # compositing/absence cases); an ungated proof is not a proof. The rendered guard
      # itself (`e2e/state-surface-contrast-guard.spec.ts`) is separately gated by the `e2e`
      # job's Playwright discovery (config glob + `testIgnore`, partitioned by scripts/e2e-shard.mjs) below -- this line gates the FAST, browser-free
      # self-test alongside `check:tokens:selftest`, not a duplicate of the `e2e` job.
      - run: npm run check:state-contrast:selftest
      # HEL-1361: proves the e2e shard partition (scripts/e2e-shard.mjs) is exact-once and failable.
      # Wired into BOTH .husky/pre-commit and here, like check:tokens:selftest above.
      - run: npm run check:e2e-shard:selftest
      # HEL-996: check:openspec[:selftest] existed as runnable npm scripts, wired only into
      # .husky/pre-commit -- but unlike HEL-913/HEL-846 above, that was not an oversight: `openspec`
      # is a globally-installed CLI (~/.local/bin/openspec on a dev machine), not a repo
      # devDependency -- see scripts/check-openspec-version.mjs's header ("detection, not a true
      # dependency pin" -- proper pinning is a local devDependency plus rewiring every Concertino
      # `core/` invocation, tracked separately). These checks could not run on a bare CI runner at
      # all until it is installed here. Install the exact version scripts/check-openspec-version.mjs
      # pins (`EXPECTED`), single-sourced via `--print-expected` (design.md Decision 6) rather than
      # hardcoded a second time. The assignment form is required, not `npm i -g
      # @fission-ai/openspec@$(...)` inline: bash -e does not trip on a failing command
      # substitution in argument position, so an empty print would silently install `latest` and
      # stay green.
      - name: Install openspec CLI
        run: |
          V="$(node scripts/check-openspec-version.mjs --print-expected)"
          [ -n "$V" ] || exit 1
          npm i -g "@fission-ai/openspec@$V"
      # Runtime assertion that what actually landed on PATH is EXPECTED -- closes the
      # empty-print/wrong-print/stale-cache/registry-redirect variants that the install step's own
      # exit code cannot (design.md Decision 6).
      - run: npm run check:openspec-version
      # Wiring the gate and its self-test together, not the self-test alone: a self-test exists to
      # certify a gate, and shipping it alone would leave that gate still never running in CI.
      - run: npm run check:openspec
      - run: npm run check:openspec:selftest
      # HEL-1123: check:repo-integrity/check:scala-quality/check:schemas/check:spec-structure
      # existed as runnable npm scripts, wired only into .husky/pre-commit -- bypassable with
      # `--no-verify`/`HUSKY=0`/hooks-not-firing-in-a-worktree, exactly the HEL-913/846/1037/996
      # failure mode this file's own comments already name four times. check:spec-structure is
      # placed here (not earlier) so it inherits the `openspec` CLI install/version-pin done by
      # the two steps directly above it.
      - run: npm run check:repo-integrity
      - run: npm run check:scala-quality
      - run: npm run check:test-temp-dir-hygiene
      - run: npm run check:test-temp-dir-hygiene:selftest
      - run: npm run check:e2e-evidence-paths
      - run: npm run check:e2e-evidence-paths:selftest
      - run: npm run check:schemas
      # HEL-1148: keeps check:schemas's agent-facing-panel-type derivation (exclusion table +
      # wire-expressibility assertions) failable. CI-only on purpose, like the other selftests above
      # that avoid touching `.husky/**` (the gate-chain-change requirements).
      - run: npm run check:schemas:selftest
      - run: npm run check:spec-structure
      # HEL-1123: drift guard closing the class of hole this whole comment thread documents --
      # fails CI if .husky/pre-commit gains a check that no workflow job in ci-complete's `needs:`
      # actually runs, so the hook and CI cannot silently diverge again.
      - run: npm run check:precommit-ci-parity
      - run: npm run check:precommit-ci-parity:selftest
      - run: npm test

  backend:
    runs-on: ubuntu-latest
    # HEL-1287: the suite runs as SHARD_COUNT parallel legs of this one job id, so `ci-complete`'s
    # `needs: backend` waits on every leg and sees `failure` if any leg fails. backend/project/TestShards.scala
    # assigns each suite to exactly one shard and fails the leg, naming the suite, if that is ever not true.
    # HEL-1287 D11: measured legs take 3.4-6.4 min (runs 37382209230, 37387080368: cold 237-385 s); 15 min is ~2.5x the cold worst case.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      # Equal to the leg count: documents the owner's ~4-leg cap (C6) rather than throttling; a lower value would
      # serialise legs and miss the time target.
      max-parallel: 4
      matrix:
        shard: [0, 1, 2, 3]
    env:
      HELIO_TEST_SHARD_INDEX: ${{ matrix.shard }}
      # Derived from the matrix size so the shard count can never disagree with the legs that actually run
      # (a count larger than the matrix would silently skip the surplus shards' suites).
      HELIO_TEST_SHARD_COUNT: ${{ strategy.job-total }}
      # HEL-1287: really run 2 forked groups at once per leg (see build.sbt; sbt's own limit of 1 otherwise wins).
      HEL924_TEST_GROUP_CONCURRENCY: 2
      HEL924_TEST_GROUP_COUNT: 4
      # HEL-822: dual-support REST source create now synthesizes an implicit
      # Connector (ImplicitConnectorConfig -> ConnectorRepository.create ->
      # ConnectorCredentialRepository.create) for the legacy bare-url create
      # path, which nearly every pre-existing rest_api-creating spec exercises
      # -- so CONNECTOR_MASTER_KEY is now load-bearing for the whole backend
      # suite, not just HEL-536/821's own dedicated credential specs (those
      # construct their own EnvMasterKeyProvider(testEnv) with a fake map and
      # never depended on this). ApiRoutes.scala's `new EnvMasterKeyProvider()`
      # reads real sys.env with no fallback (design.md HEL-536 Decision 4: same
      # code path in every environment, only the value differs) -- a fixed,
      # CI-only test value, exactly like the e2e job's GOOGLE_CLIENT_ID
      # placeholder above. Never the real prod secret.
      CONNECTOR_MASTER_KEY: Npxr5hOsyxOtPW4HWFBYHmWKcbPDP+ss+3x1fAdNaP0=
      CONNECTOR_MASTER_KEY_ID: ci-test-2026-08
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: sbt/setup-sbt@v1
      - name: Cache sbt
        uses: actions/cache@v6
        with:
          path: |
            ~/.sbt
            ~/.ivy2/cache
            ~/.cache/coursier
          key: sbt-${{ hashFiles('**/build.sbt') }}
          restore-keys: sbt-
      # HEL-1287 D7: restore the nearest earlier compile output so sbt/zinc compiles incrementally (only changed
      # sources and their dependents). sbt 2 writes compile outputs into its content-addressed disk cache
      # (~/.cache/sbt/v2/cas) and leaves SYMLINKS to it under backend/target/out, so BOTH paths are one entry:
      # `target/out` alone restores dangling links (run 37382209230 attempt 2: every leg failed with
      # "Not found: TestShards"). Test reports are excluded so results cannot leak between runs; tests always
      # re-run (`testFull` never serves a cached result). Hygiene: every run only RESTORES (exact key, then the
      # newest backend-compile-v3 entry); only a push to main, from shard 0, saves (below), so there is at most one
      # entry per main push and none per PR or per leg. The prefix is deliberately outside the `sbt-` namespace so
      # the dependency step's `restore-keys: sbt-` can never prefix-match a compile entry.
      - name: Restore backend compile output
        id: compile-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            backend/target/out
            ~/.cache/sbt
            !backend/target/out/**/test-reports
          key: backend-compile-v3-${{ runner.os }}-${{ hashFiles('backend/src/**', 'backend/build.sbt', 'backend/project/*.scala', 'backend/project/*.sbt', 'backend/project/build.properties') }}
          restore-keys: backend-compile-v3-${{ runner.os }}-
      # HEL-1339: the diagnostics helper's own selftest needs a JDK (jcmd), so it runs here, in shard 0 only
      # (node built-ins only: this job has no setup-node). CI-only, like the other selftests (no `.husky/**` change).
      - name: Selftest sbt hang diagnostics (shard 0)
        if: matrix.shard == 0
        run: time npm run selftest:ci-sbt
      - name: Compile and test
        # HEL-1339: sbt runs through scripts/ci-sbt.sh: `--server` (one foreground JVM, no sbtn -> background-server
        # handoff, the suspect in two silent hangs) plus an in-step deadline (660 s; step bound 13 min) that captures
        # a thread dump of the recorded sbt JVM, uploaded as an artifact, before failing. 660 + 25 capture + 5 grace
        # < 780 s step bound; 780 s + pre-steps (25-40 s) < 900 s job bound.
        timeout-minutes: 13
        # HEL-1018: one quoted command -- sbt 2's thin client joins unquoted args into a single
        # (unparseable) command; testFull never serves a cached result.
        # HEL-1273: the sbt server's heap was 1.00GB here; main's base ran at ~97% of it (85-97% GC)
        # and PR #769's test compile hit `java.lang.OutOfMemoryError: Java heap space`. A first try
        # (`sbt -J-Xmx3g` via the thin client) still printed 1073741824 on this runner although it
        # gave 3221225472 locally, so the heap is set two ways at once (a CI-only `.jvmopts`, untracked;
        # backend/.sbtopts is untouched, and `-J-Xmx3g`). The leading `eval` prints the JVM's real max heap into
        # this log -- keep it: it is the heap proof for whichever client mode is in use.
        run: |
          printf '%s\n' -Xmx3g > .jvmopts
          "$GITHUB_WORKSPACE/scripts/ci-sbt.sh" --deadline 660 --dir . -- -batch -J-Xmx3g "eval java.lang.Runtime.getRuntime.maxMemory; compile; testFull"
        working-directory: backend
      - name: Save backend compile output (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && matrix.shard == 0 && steps.compile-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            backend/target/out
            ~/.cache/sbt
            !backend/target/out/**/test-reports
          key: backend-compile-v3-${{ runner.os }}-${{ hashFiles('backend/src/**', 'backend/build.sbt', 'backend/project/*.scala', 'backend/project/*.sbt', 'backend/project/build.properties') }}
      # HEL-1287: JUnit XML (one per suite, `time` attribute) is the per-suite profile source.
      - name: Upload backend JUnit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-junit-reports-shard-${{ matrix.shard }}
          path: backend/target/**/test-reports/*.xml
          if-no-files-found: warn
          retention-days: 14
      - name: Upload sbt hang diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sbt-diagnostics-backend-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/sbt-diagnostics
          if-no-files-found: ignore
          retention-days: 14

  # HEL-459: fails the build on a new high/critical CVE. Backend: a small sbt task
  # (build.sbt `generateSbom`) reads the resolved compile-scope classpath's attached
  # ModuleIDs into a CycloneDX SBOM; osv-scanner (keyless, queries osv.dev live — no
  # local vulnerability DB, so no extra cache beyond the existing sbt/coursier cache) scans
  # it, with day-one-known-unfixable advisories suppressed via backend/osv-scanner.toml
  # (see that file for individual written justifications). Frontend: audit-ci wraps
  # `npm audit` for three lockfiles: root (at "high", against .audit-ci.jsonc),
  # frontend/ (at "moderate", frontend/.audit-ci.jsonc -- HEL-1320) and helio-mcp/ (at "moderate", against
  # helio-mcp/.audit-ci.jsonc -- HEL-1204; it runs the ROOT-pinned audit-ci with --directory,
  # since helio-mcp does not declare audit-ci itself). See design.md D2/D3/D6 for the tool
  # choices and the severity-filter rationale.
  security:
    runs-on: ubuntu-latest
    # HEL-1287 D11: measured 69-90 s (runs 37382209230, 37387080368). HEL-1296: the SBOM step now has its
    # own 2-min timeout (inside this bound), and every audit reports independently of the others.
    timeout-minutes: 5
    steps:
      - id: checkout
        uses: actions/checkout@v7
      - id: setup-java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - id: setup-sbt
        uses: sbt/setup-sbt@v1
      - name: Cache sbt
        uses: actions/cache@v6
        with:
          path: |
            ~/.sbt
            ~/.ivy2/cache
            ~/.cache/coursier
          key: sbt-${{ hashFiles('**/build.sbt') }}
          restore-keys: sbt-
      - id: setup-node
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
            helio-mcp/package-lock.json
      - id: npm-ci-root
        if: ${{ !cancelled() && steps.setup-node.outcome == 'success' }}
        run: npm ci
      - id: npm-ci-frontend
        if: ${{ !cancelled() && steps.setup-node.outcome == 'success' }}
        run: npm --prefix frontend ci

      # HEL-1296: bounded (measured ~20 s); a hung step fails at 2 min so the npm audits still fit the job timeout.
      # HEL-1339: via scripts/ci-sbt.sh -- `--server` (no sbtn handoff) and a 75 s in-step deadline that captures a
      # thread dump first: 75 + 25 capture + 5 grace = 105 s < the 2-minute step bound.
      - name: Generate backend SBOM
        id: sbom
        if: ${{ !cancelled() && steps.setup-java.outcome == 'success' && steps.setup-sbt.outcome == 'success' }}
        timeout-minutes: 2
        working-directory: backend
        run: '"$GITHUB_WORKSPACE/scripts/ci-sbt.sh" --deadline 75 --dir . -- -batch generateSbom'

      - name: Backend SBOM positive control
        id: sbom-control
        if: ${{ !cancelled() && steps.sbom.outcome == 'success' }}
        working-directory: backend
        run: |
          count=$(jq '.components | length' target/sbom.cdx.json)
          echo "SBOM component count: $count"
          if [ -z "$count" ] || [ "$count" -eq 0 ]; then
            echo "SBOM has zero components — refusing to trust a scan of it as clean" >&2
            exit 1
          fi

      # HEL-1339: measured 0-1 s in 20 distinct successful security jobs sampled (ci-evidence.md) -> 1 minute (the floor; 2.5 x the 1 s max rounds up to 1). curl's own
      # --max-time 45 sits below the 60 s step bound so its error message surfaces first.
      - name: Install osv-scanner
        id: osv-install
        if: ${{ !cancelled() && steps.sbom-control.outcome == 'success' }}
        timeout-minutes: 1
        run: |
          curl -fsSL --connect-timeout 15 --max-time 45 -o /usr/local/bin/osv-scanner \
            https://github.com/google/osv-scanner/releases/download/v2.5.1/osv-scanner_linux_amd64
          chmod +x /usr/local/bin/osv-scanner
          osv-scanner --version

      # HEL-1339: measured 0-1 s -> 1 minute floor; a stalled scan fails here and the CVSS step is skipped.
      - name: Scan backend SBOM (osv-scanner)
        id: osv-scan
        if: ${{ !cancelled() && steps.osv-install.outcome == 'success' }}
        timeout-minutes: 1
        working-directory: backend
        run: |
          set +e
          osv-scanner scan --sbom=target/sbom.cdx.json --config=osv-scanner.toml --format=json \
            > /tmp/osv-scan.json
          exit_code=$?
          set -e
          # osv-scanner exit 0/1 both mean "the scan completed" (0 findings / findings present);
          # >=127 means the scan itself errored (network/parse failure) — hard-fail immediately
          # without trusting the (likely empty/garbage) JSON output as a clean result.
          if [ "$exit_code" -ge 127 ]; then
            echo "osv-scanner errored (exit $exit_code) — scan did not complete" >&2
            cat /tmp/osv-scan.json >&2
            exit 1
          fi
          cat /tmp/osv-scan.json

      - name: Enforce backend CVSS >= 7 threshold
        if: ${{ !cancelled() && steps.osv-scan.outcome == 'success' }}
        working-directory: backend
        run: |
          # osv-scanner has no severity-threshold flag (verified against its CLI flags and
          # docs/output.md); its own findings-present exit code would over-gate on
          # LOW/MODERATE. `max_severity` is osv-scanner's own already CVSS-resolved score,
          # serialized as a JSON *string* (e.g. "7.8", "9", or "" when absent) — coerce to a
          # number before comparing; when absent, fall back to database_specific.severity
          # (looked up per-vulnerability-id, since that field lives on `.vulnerabilities[]`,
          # not on `.groups[]`) in {HIGH, CRITICAL}. [[IgnoredVulns]]-suppressed results are
          # already stripped from this JSON by osv-scanner itself before this filter runs.
          failures=$(jq '
            [
              .results[]? .packages[]? as $pkg |
              ($pkg.vulnerabilities // []) as $vulns |
              $pkg.groups[]? |
              . as $group |
              (
                (($group.max_severity // "") as $ms |
                  if $ms == "" then null else ($ms | tonumber) end
                )
              ) as $score |
              (
                if $score != null then ($score >= 7)
                else
                  ([$vulns[] | select(.id as $id | $group.ids | index($id) != null)
                    | .database_specific.severity // ""]
                    | any(. == "HIGH" or . == "CRITICAL"))
                end
              ) as $fails |
              select($fails) |
              {package: $pkg.package.name, ecosystem: $pkg.package.ecosystem,
               ids: $group.ids, max_severity: $group.max_severity}
            ]
          ' /tmp/osv-scan.json)
          echo "$failures"
          count=$(echo "$failures" | jq 'length')
          if [ "$count" -gt 0 ]; then
            echo "Found $count unsuppressed backend advisory group(s) with CVSS >= 7 (or HIGH/CRITICAL severity)" >&2
            exit 1
          fi

      - name: Frontend audit (root)
        if: ${{ !cancelled() && steps.npm-ci-root.outcome == 'success' }}
        run: npx audit-ci --config .audit-ci.jsonc

      - name: Frontend audit (frontend/)
        if: ${{ !cancelled() && steps.npm-ci-frontend.outcome == 'success' }}
        working-directory: frontend
        run: npx audit-ci --config .audit-ci.jsonc

      # HEL-1204: root-pinned audit-ci (installed by the root `npm ci` above) reading helio-mcp's
      # lockfile; an audit needs only the lockfile, so no `npm --prefix helio-mcp ci` here.
      - name: helio-mcp audit (helio-mcp/)
        if: ${{ !cancelled() && steps.npm-ci-root.outcome == 'success' }}
        run: npx audit-ci --config helio-mcp/.audit-ci.jsonc --directory helio-mcp

      - name: Upload sbt hang diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sbt-diagnostics-security
          path: ${{ runner.temp }}/sbt-diagnostics
          if-no-files-found: ignore
          retention-days: 14

  # HEL-951 — this job runs Playwright by GLOB (`npx playwright test`, no
  # per-file arguments), so discovery is governed entirely by
  # `playwright.config.ts` (`testDir: "./e2e"`, `testIgnore`). This
  # replaces the previous individual-spec allowlist
  # (e2e/hel813-mobile-touch-target-floor.spec.ts +
  # e2e/hel910-pipeline-to-dashboard-flow.spec.ts only), which had silently
  # left eleven other e2e/ specs never CI-gated — see
  # openspec/changes/wire-orphaned-e2e-specs/ for the investigation and
  # orphan-status-report.md for the per-spec disposition.
  #
  # `**/*.regression.spec.ts` (currently only
  # e2e/hel813-mobile-touch-target-floor.regression.spec.ts) is excluded
  # from this glob DELIBERATELY, via `playwright.config.ts`'s own
  # `testIgnore`, and must never be added here: it temporarily patches REAL
  # component source on disk (self-reverting, but still a job that rewrites
  # tracked files has no business running unattended in CI) to prove the
  # steady-state guard is sensitive to two known-bad shapes. See
  # `e2e/README.md` for what it does, why it's excluded, and how to run it
  # on demand.
  #
  # Any orphan found red or flaky as of HEL-951 is quarantined via its own
  # `testIgnore` entry in `playwright.config.ts`, each carrying a comment
  # naming its follow-up ticket — see that file for the current list.
  e2e:
    runs-on: ubuntu-latest
    # Slowest leg measures ~7 min; ~2.5x so a hung leg frees its runner instead of holding it for
    # the 6 h default (HEL-1288).
    timeout-minutes: 18
    # HEL-1288 (C8) — at most 4 legs (account-wide concurrent-job cap, shared with the backend job's legs;
    # see profile.md); per-leg speed comes from Playwright `workers` (playwright.config.ts), not more legs.
    # Sharded across N runners (each with its OWN Postgres service, backend and Vite,
    # so shards share no mutable state). `fail-fast: false` so every shard reports; the matrix
    # job's aggregate result is `failure` if any leg fails, which `ci-complete` (needs: e2e)
    # already treats as a failed required check.
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [1, 2, 3, 4]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: helio
          POSTGRES_PASSWORD: helio
          POSTGRES_DB: helio
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: jdbc:postgresql://localhost:5432/helio
      DB_USER: helio
      DB_PASSWORD: helio
      HELIO_UPLOADS_BACKEND: local
      DEV_PORT: 5173
      BACKEND_PORT: 8080
      # Required at boot (com.helio.app.Main's requireEnv), but only
      # exercised by the real Google OAuth login flow, which this guard
      # never uses (register/login goes through the email/password path) —
      # placeholders, same pattern docs/cloud-dev-setup.md uses for local
      # dev. Root-caused via CI run 32902461344: "Missing required
      # environment variable: GOOGLE_CLIENT_ID" crashed the actor system
      # guardian before any Playwright test could even connect.
      GOOGLE_CLIENT_ID: placeholder
      GOOGLE_CLIENT_SECRET: placeholder
      GOOGLE_REDIRECT_URI: http://localhost:5173/auth/callback
      # HEL-824 — mirrors the `backend` job's own CONNECTOR_MASTER_KEY/_ID
      # above verbatim. HEL-536/HEL-821 shipped without any e2e-tested UI
      # flow that reaches `POST /api/connectors` (ConnectorRepository.create
      # unconditionally calls credentialRepo.create -> EncryptedSecretBackend
      # .encrypt, which fails closed with MasterKeyError.NoKeyConfigured when
      # unset, even for a no-auth Connector's empty-string credential — this
      # is correct, existing behavior, not something to work around here), so
      # this job's env block never needed the key until now. HEL-824's
      # surface-7 Connectors-page e2e test is the first to create a real
      # Connector through the UI, exposing the gap. CI-only test value, never
      # the real prod secret.
      CONNECTOR_MASTER_KEY: Npxr5hOsyxOtPW4HWFBYHmWKcbPDP+ss+3x1fAdNaP0=
      CONNECTOR_MASTER_KEY_ID: ci-test-2026-08
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: sbt/setup-sbt@v1
      - name: Cache sbt
        uses: actions/cache@v6
        with:
          path: |
            ~/.sbt
            ~/.ivy2/cache
            ~/.cache/coursier
          key: sbt-${{ hashFiles('**/build.sbt') }}
          restore-keys: sbt-
      # HEL-1288 — the backend (sbt compile + boot, ~85 s) is the longest non-test step, so it
      # is started in the background right after the sbt cache restores and overlaps the npm /
      # browser steps below; the health wait is a separate, later step that still fails loudly
      # and dumps the log.
      - name: Start backend (sbt run, background)
        run: scripts/e2e-backend.sh start
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      - run: npm ci
      - run: npm --prefix frontend ci
      # HEL-1288 measured an `~/.cache/ms-playwright` cache and dropped it: the dominant cost of
      # this step is `--with-deps` (apt), not the browser download, and a hit (restore 5-10 s +
      # install 21-27 s) was no faster than the uncached baseline (22-23 s).
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      # Fail-fast health wait (HEL-1288): detects a dead sbt group or one hung before compile/run within
      # seconds and dumps /tmp/backend.log on failure (no restart). See scripts/e2e-backend.sh.
      - name: Wait for backend health
        run: scripts/e2e-backend.sh wait
      - name: Start frontend (Vite dev server)
        working-directory: frontend
        run: |
          nohup npx vite --port 5173 > /tmp/frontend.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:5173/ && exit 0
            sleep 2
          done
          echo "frontend did not become healthy" >&2
          cat /tmp/frontend.log
          exit 1
      # HEL-951 contract preserved: discovery is still Playwright's own (`playwright test --list`
      # over the config's glob and `testIgnore`). HEL-1361: scripts/e2e-shard.mjs partitions that
      # discovered set by per-file weight (e2e/shard-weights.tsv, from CI timings) instead of
      # Playwright's count-based `--shard`, verifies every spec lands in exactly one leg, and
      # fails loudly (naming files) on any partition or selection defect. Not a hand-picked list.
      - name: Run e2e suite (Playwright discovery via config glob + testIgnore, weighted shard)
        run: node scripts/e2e-shard.mjs run ${{ matrix.shard }} ${{ strategy.job-total }}
      # HEL-910 task 6.3 note: the P1.4 Sleeper MCP rebuild acceptance test
      # (`helio-mcp/e2e/sleeper-rebuild.ts`) is deliberately NOT wired in
      # here. Correcting an assumption from the ticket brief: it does NOT
      # need live Sleeper API credentials (its own header comment: it drives
      # four representative STATIC sources shaped like Sleeper's domain, not
      # a live API pull) — the real gap is that it's still a standalone
      # ts-node-style script with no npm entry point and needs a HELIO_PAT
      # minted against a running backend, neither of which this job
      # currently provisions. Wiring it in is a real, scoped follow-up
      # (npm script + PAT bootstrap step), not a live-credentials problem.
      # Per-shard artifact names (upload-artifact v4+ rejects duplicate names within a run).
      - name: Upload Playwright JSON report (per-test durations)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-json-shard-${{ matrix.shard }}
          path: test-results/results.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload sbt hang diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sbt-diagnostics-e2e-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/sbt-diagnostics
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: |
            test-results/
            /tmp/backend.log
            /tmp/frontend.log
          retention-days: 7

  # Single required status check for the `main` ruleset. Individual jobs may be
  # skipped by future path filters; a skipped job reports "skipped", which this
  # gate treats as success. Only failure/cancelled fail the gate. Never add
  # `paths-ignore` to this workflow's triggers — a skipped WORKFLOW reports no
  # status at all and would block every affected PR permanently.
  ci-complete:
    if: always()
    needs: [frontend, backend, security, e2e]
    runs-on: ubuntu-latest
    # HEL-1287 D11: measured 2-4 s of execution; 2 min leaves runner start-up jitter.
    timeout-minutes: 2
    steps:
      - name: Verify no job failed or was cancelled
        run: |
          set -euo pipefail
          echo "results: ${{ join(needs.*.result, ', ') }}"
          if ${{ contains(needs.*.result, 'failure') }}; then
            echo "A required CI job failed." >&2; exit 1
          fi
          if ${{ contains(needs.*.result, 'cancelled') }}; then
            echo "A required CI job was cancelled." >&2; exit 1
          fi
          echo "All CI jobs succeeded or were skipped."
