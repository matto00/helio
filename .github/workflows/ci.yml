name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - ".github/ISSUE_TEMPLATE/**"
      - "docs/**"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - ".github/ISSUE_TEMPLATE/**"
      - "docs/**"

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      - run: npm ci
      - run: npm --prefix frontend ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm test

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: sbt/setup-sbt@v1
      - name: Cache sbt
        uses: actions/cache@v4
        with:
          path: |
            ~/.sbt
            ~/.ivy2/cache
            ~/.cache/coursier
          key: sbt-${{ hashFiles('**/build.sbt') }}
          restore-keys: sbt-
      - name: Compile and test
        run: sbt compile test
        working-directory: backend

  # HEL-813 design.md D5 — the ONLY spec run here is the new steady-state
  # mobile touch-target guard (e2e/hel813-mobile-touch-target-floor.spec.ts).
  # The other pre-existing e2e/ specs were never CI-gated; broadening this
  # job to cover them is a natural follow-up, not bundled into this change.
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: helio
          POSTGRES_PASSWORD: helio
          POSTGRES_DB: helio
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: jdbc:postgresql://localhost:5432/helio
      DB_USER: helio
      DB_PASSWORD: helio
      HELIO_UPLOADS_BACKEND: local
      DEV_PORT: 5173
      BACKEND_PORT: 8080
      # Required at boot (com.helio.app.Main's requireEnv), but only
      # exercised by the real Google OAuth login flow, which this guard
      # never uses (register/login goes through the email/password path) —
      # placeholders, same pattern docs/cloud-dev-setup.md uses for local
      # dev. Root-caused via CI run 32902461344: "Missing required
      # environment variable: GOOGLE_CLIENT_ID" crashed the actor system
      # guardian before any Playwright test could even connect.
      GOOGLE_CLIENT_ID: placeholder
      GOOGLE_CLIENT_SECRET: placeholder
      GOOGLE_REDIRECT_URI: http://localhost:5173/auth/callback
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: sbt/setup-sbt@v1
      - name: Cache sbt
        uses: actions/cache@v4
        with:
          path: |
            ~/.sbt
            ~/.ivy2/cache
            ~/.cache/coursier
          key: sbt-${{ hashFiles('**/build.sbt') }}
          restore-keys: sbt-
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      - run: npm ci
      - run: npm --prefix frontend ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Start backend (sbt run)
        working-directory: backend
        run: |
          nohup sbt run > /tmp/backend.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:8080/health && exit 0
            sleep 5
          done
          echo "backend did not become healthy" >&2
          cat /tmp/backend.log
          exit 1
      - name: Start frontend (Vite dev server)
        working-directory: frontend
        run: |
          nohup npx vite --port 5173 > /tmp/frontend.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:5173/ && exit 0
            sleep 2
          done
          echo "frontend did not become healthy" >&2
          cat /tmp/frontend.log
          exit 1
      - name: Run HEL-813 mobile touch-target floor guard
        run: npx playwright test e2e/hel813-mobile-touch-target-floor.spec.ts
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            test-results/
            /tmp/backend.log
            /tmp/frontend.log
          retention-days: 7
