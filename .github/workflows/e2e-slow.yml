# HEL-1667: weekly slow lane for the e2e sweeps that PR CI skips behind HELIO_E2E_SLOW=1 (the 390/768 MAXIMAL phone
# sweeps, HEL-1582 owner ruling). Deliberately NOT a job in ci.yml: that would put it in ci-complete's needs and on every
# PR. Setup steps mirror ci.yml's `e2e` job (postgres service, env, sbt cache restore, backend, npm, browsers, Vite);
# keep the two in step. Triggers: weekly cron, manual dispatch, and a PR that edits this file (proves the workflow
# before merge).
name: e2e-slow

on:
  schedule:
    - cron: "17 10 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/e2e-slow.yml"

permissions:
  contents: read

# A weekly run and a manual run must never cancel each other.
concurrency:
  group: e2e-slow-${{ github.ref }}
  cancel-in-progress: false

jobs:
  e2e-slow:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:16
        env:
          POSTGRES_USER: helio
          POSTGRES_PASSWORD: helio
          POSTGRES_DB: helio
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: jdbc:postgresql://localhost:5432/helio
      DB_USER: helio
      DB_PASSWORD: helio
      HELIO_UPLOADS_BACKEND: local
      DEV_PORT: 5173
      BACKEND_PORT: 8080
      # Placeholders required at boot; same as ci.yml's e2e job.
      GOOGLE_CLIENT_ID: placeholder
      GOOGLE_CLIENT_SECRET: placeholder
      GOOGLE_REDIRECT_URI: http://localhost:5173/auth/callback
      # CI-only test value, never the real prod secret (same as ci.yml's e2e job).
      CONNECTOR_MASTER_KEY: Npxr5hOsyxOtPW4HWFBYHmWKcbPDP+ss+3x1fAdNaP0=
      CONNECTOR_MASTER_KEY_ID: ci-test-2026-08
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: sbt/setup-sbt@v1
      - name: Restore sbt dependency cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.sbt
            ~/.ivy2/cache
            ~/.cache/coursier
          key: sbt-${{ hashFiles('**/build.sbt') }}
          restore-keys: sbt-
      - name: Start backend (sbt run, background)
        run: scripts/e2e-backend.sh start
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      - run: npm ci
      - run: npm --prefix frontend ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Wait for backend health
        run: scripts/e2e-backend.sh wait
      - name: Start frontend (Vite dev server)
        working-directory: frontend
        run: |
          nohup npx vite --port 5173 > /tmp/frontend.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:5173/ && exit 0
            sleep 2
          done
          echo "frontend did not become healthy" >&2
          cat /tmp/frontend.log
          exit 1
      # Whole files: the gated MAXIMAL tests plus their cheap ungated siblings. CI=true (set by Actions) makes
      # playwright.config.ts write test-results/results.json for the guard below.
      - name: Run slow-gated sweeps (HELIO_E2E_SLOW=1)
        env:
          HELIO_E2E_SLOW: "1"
        run: npx playwright test e2e/hel1582-sweep-390.spec.ts e2e/hel1582-sweep-768.spec.ts
      # A renamed or broken gate must not produce a green run that exercised nothing.
      - name: Guard - fail if any selected test was skipped or none ran
        if: always()
        run: node scripts/check-e2e-slow-results.mjs test-results/results.json
      - name: Upload Playwright JSON report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-json-e2e-slow
          path: test-results/results.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-e2e-slow
          path: |
            test-results/
            /tmp/backend.log
            /tmp/frontend.log
          retention-days: 7
