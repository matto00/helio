# HEL-1698: the e2e setup steps shared by ci.yml `e2e`, ci.yml `e2e-prod-build` and e2e-slow.yml (previously three
# copies that had to be "kept in step"). Each calling job keeps what a composite action cannot hold: `services`
# (postgres), `env`, `timeout-minutes`, the checkout (a local action must be checked out first), its test steps
# and uploads. Dependabot scans this directory (directories glob in .github/dependabot.yml). Commands and step order are identical to the former inline steps.
# HEL-1699: `node_modules` + `frontend/node_modules` are cached under an exact lockfile/Node-major-keyed entry (no restore-keys);
# on a hit both `npm ci` steps are skipped, because the `~/.npm` download cache alone did not bound `npm ci` (run
# 39711300255: cache hit, then a 7 min install). Per ci-actions-cache-budget the entry is saved only on a main push, by
# the one job that passes `save-node-modules-cache: true` (ci.yml `e2e` leg 1); every other job only restores.
name: e2e-setup
description: Java, sbt cache, background backend, Node, npm ci, Playwright chromium, backend health wait, optional Vite dev server.

inputs:
  start-dev-frontend:
    description: 'Start the Vite dev server on :5173 ("false" for a job that serves its own build, e.g. vite preview).'
    required: false
    default: "true"
  save-node-modules-cache:
    description: 'Save the node_modules cache after install ("true" for exactly one job per run; it still saves only on a main push with a restore miss).'
    required: false
    default: "false"
  node-major:
    description: "Node major version: the single source for setup-node's node-version AND the node_modules cache key. Keyed on the major only (native ABI is fixed per major); runners in one run resolved different patches (22.23.3 vs 22.23.4, run 39816349491), which split the key."
    required: false
    default: "22"

runs:
  using: composite
  steps:
    - uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: 21
    - uses: sbt/setup-sbt@v1
    # HEL-1299 D1: every job only RESTORES the sbt dependency cache; the one save is backend shard 0 on a main push.
    - name: Restore sbt dependency cache
      uses: actions/cache/restore@v6
      with:
        path: |
          ~/.sbt
          ~/.ivy2/cache
          ~/.cache/coursier
        key: sbt-${{ hashFiles('**/build.sbt') }}
        restore-keys: sbt-
    # HEL-1288 — the backend (sbt compile + boot, ~85 s) is the longest non-test step, so it
    # is started in the background right after the sbt cache restores and overlaps the npm /
    # browser steps below; the health wait is a separate, later step that still fails loudly
    # and dumps the log.
    - name: Start backend (sbt run, background)
      shell: bash
      run: scripts/e2e-backend.sh start
    - uses: actions/setup-node@v7
      id: setup-node
      with:
        node-version: ${{ inputs.node-major }}
        cache: npm
        cache-dependency-path: |
          package-lock.json
          frontend/package-lock.json
    # HEL-1699 D1: exact key only (no restore-keys) so a partial tree from another lockfile is never used without `npm ci`.
    - name: Restore node_modules cache
      id: node-modules
      uses: actions/cache/restore@v6
      with:
        path: |
          node_modules
          frontend/node_modules
        key: e2e-node-modules-v1-${{ runner.os }}-${{ runner.arch }}-node${{ inputs.node-major }}-${{ hashFiles('package-lock.json', 'frontend/package-lock.json') }}
    - run: npm ci
      if: steps.node-modules.outputs.cache-hit != 'true'
      shell: bash
    - run: npm --prefix frontend ci
      if: steps.node-modules.outputs.cache-hit != 'true'
      shell: bash
    # HEL-1699 D3: save right after install (not a post-job step), so a later test failure cannot prevent it.
    - name: Save node_modules cache
      if: inputs.save-node-modules-cache == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.node-modules.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: |
          node_modules
          frontend/node_modules
        key: ${{ steps.node-modules.outputs.cache-primary-key }}
    # HEL-1288 measured an `~/.cache/ms-playwright` cache and dropped it: the dominant cost of
    # this step is `--with-deps` (apt), not the browser download, and a hit (restore 5-10 s +
    # install 21-27 s) was no faster than the uncached baseline (22-23 s).
    - name: Install Playwright browsers
      shell: bash
      run: npx playwright install --with-deps chromium
    # Fail-fast health wait (HEL-1288): detects a dead sbt group or one hung before compile/run within
    # seconds and dumps /tmp/backend.log on failure (no restart). See scripts/e2e-backend.sh.
    - name: Wait for backend health
      shell: bash
      run: scripts/e2e-backend.sh wait
    - name: Start frontend (Vite dev server)
      if: inputs.start-dev-frontend == 'true'
      shell: bash
      working-directory: frontend
      run: |
        nohup npx vite --port 5173 > /tmp/frontend.log 2>&1 &
        for i in $(seq 1 30); do
          curl -sf http://localhost:5173/ && exit 0
          sleep 2
        done
        echo "frontend did not become healthy" >&2
        cat /tmp/frontend.log
        exit 1
