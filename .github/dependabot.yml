version: 2
# Group ordering is load-bearing: Dependabot assigns each dependency to the
# FIRST group whose criteria it matches, in declaration order. Pattern groups
# must therefore be declared BEFORE the `dev-dependencies` catch-all, or the
# catch-all claims every devDependency a pattern group meant to hold (e.g.
# `@types/react*`). Do not "tidy" the catch-all back to the top.
#
# Every family pattern is an exact package name, with `@types/react*` as the
# only wildcard anywhere: once specific groups are declared first, a loose
# pattern such as `react*` would swallow react-dom, react-redux,
# react-markdown, react-router-dom and react-grid-layout into whichever group
# is declared earliest. Enforced by `npm run check:dependabot` (HEL-898).
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels: ["dependencies"]
    ignore:
      # HEL-1725: these majors broke every grouped PR that carried them
      # (ts-jest peers typescript <7; eslint-plugin-react peers eslint <=9).
      # Migration tracked in HEL-1726; remove these rules there.
      - dependency-name: "typescript"
        versions: [">=7"]
      - dependency-name: "eslint"
        versions: [">=10"]
      - dependency-name: "@eslint/js"
        versions: [">=10"]
      - dependency-name: "js-yaml"
        versions: [">=5"]
    groups:
      dev-dependencies:
        dependency-type: "development"

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    # 15, not 10: this config alone held exactly 10 open PRs against a limit of
    # 10 in the HEL-898 backlog — saturated, silently suppressing further
    # frontend updates. 15 with four families grouped is a lower effective
    # flood than 10 ungrouped was. The other three configs are nowhere near
    # their limits and stay at 10.
    open-pull-requests-limit: 15
    labels: ["dependencies"]
    ignore:
      # HEL-1725: these majors broke every grouped PR that carried them
      # (ts-jest peers typescript <7; eslint-plugin-react peers eslint <=9).
      # Migration tracked in HEL-1726; remove these rules there.
      - dependency-name: "typescript"
        versions: [">=7"]
      - dependency-name: "eslint"
        versions: [">=10"]
      - dependency-name: "@eslint/js"
        versions: [">=10"]
      - dependency-name: "js-yaml"
        versions: [">=5"]
      # HEL-1728: react-grid-layout 2.3.0 regressed drag/resize: the item lags
      # until the pointer crosses half a grid step, then jumps (GridItem memo
      # #2240 plus the stable onDragStop from eb35b82c). Upstream:
      # https://github.com/react-grid-layout/react-grid-layout/issues/2303,
      # fixed by PR #2304 (commit 1468c0f), unreleased as of 2026-11-17.
      # Remove this rule once a release contains 1468c0f and
      # hel1573-motion-grid-chart.spec.ts:275 passes 20/20 on it.
      - dependency-name: "react-grid-layout"
        versions: [">=2.3.0"]
    groups:
      # Co-versioned families: each shares a compile-time or runtime contract,
      # so a member raised alone is typechecked against its siblings' old
      # versions — the HEL-898 failure (`IconDefinition` vs `IconProp`).
      echarts:
        patterns:
          - "echarts"
          - "echarts-for-react"
      redux:
        patterns:
          - "@reduxjs/toolkit"
          - "react-redux"
      markdown:
        patterns:
          - "react-markdown"
          - "remark-gfm"
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react*"
      dev-dependencies:
        dependency-type: "development"

  - package-ecosystem: "npm"
    directory: "/helio-mcp"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels: ["dependencies"]
    ignore:
      # HEL-1725: these majors broke every grouped PR that carried them
      # (ts-jest peers typescript <7; eslint-plugin-react peers eslint <=9).
      # Migration tracked in HEL-1726; remove these rules there.
      - dependency-name: "typescript"
        versions: [">=7"]
      - dependency-name: "eslint"
        versions: [">=10"]
      - dependency-name: "@eslint/js"
        versions: [">=10"]
      - dependency-name: "js-yaml"
        versions: [">=5"]
    groups:
      # The SDK declares zod as a peer and helio-mcp passes zod schemas into
      # `registerTool`, so a lone zod major bump typechecks against the old SDK's types.
      mcp-sdk:
        patterns:
          - "@modelcontextprotocol/sdk"
          - "zod"
      dev-dependencies:
        dependency-type: "development"

  - package-ecosystem: "github-actions"
    # "/" covers .github/workflows/*; the glob covers composite actions (HEL-1698: .github/actions/e2e-setup).
    directories: ["/", "/.github/actions/*"]
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels: ["dependencies"]
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: "sbt"
    directory: "/backend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels: ["dependencies"]
    ignore:
      # HEL-1725: Scala 3, Pekko 2, Spark 4 and Flyway 13 are migrations, not
      # bumps; in the sbt group they made #1117 unbuildable (no Spark _3 jars).
      - dependency-name: "org.scala-lang:*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "org.apache.pekko:*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "org.apache.spark:*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "org.flywaydb:*"
        update-types: ["version-update:semver-major"]
    groups:
      sbt:
        patterns: ["*"]
